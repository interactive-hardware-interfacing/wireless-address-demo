<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="system-ui, sans-serif" font-size="12">
  <style>
    .board { fill: #eef1f4; stroke: #556; stroke-width: 1.5; }
    .lbl { fill: #223; } .mut { fill: #667; }
    .wire { fill: none; stroke: #b5460f; stroke-width: 2; }
    .ant { fill: none; stroke: #2f7d32; stroke-width: 2; }
    .rf { fill: none; stroke: #667; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .pad { fill: #cfd6dd; stroke: #889; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .board { fill: #2a2f36; stroke: #9aa; } .lbl { fill: #e8e8e4; } .mut { fill: #9a9a92; }
      .pad { fill: #3a414a; stroke: #778; }
    }
  </style>
  <rect x="20" y="20" width="80" height="50" rx="6" class="board"/>
  <text x="60" y="48" text-anchor="middle" class="lbl">Laptop</text>
  <path d="M100 45 H 140" class="wire"/>
  <rect x="140" y="18" width="110" height="55" rx="6" class="board"/>
  <text x="195" y="40" text-anchor="middle" class="lbl" font-weight="600">XIAO C3</text>
  <text x="195" y="56" text-anchor="middle" class="mut" font-size="10">BRIDGE</text>
  <circle cx="195" cy="18" r="4" class="pad"/><path d="M195 18 V 6 h 20" class="ant"/>
  <rect x="430" y="20" width="150" height="50" rx="6" class="board"/>
  <text x="470" y="42" text-anchor="middle" class="lbl" font-weight="600" font-size="11">Node 1</text>
  <text x="470" y="56" text-anchor="middle" class="mut" font-size="9">MY_ID=1</text>
  <circle cx="545" cy="45" r="7" class="pad"/><text x="560" y="49" class="mut" font-size="9">LED</text>
  <circle cx="430" cy="20" r="4" class="pad"/><path d="M430 20 V 8 h 18" class="ant"/>
  <rect x="430" y="110" width="150" height="50" rx="6" class="board"/>
  <text x="470" y="132" text-anchor="middle" class="lbl" font-weight="600" font-size="11">Node 2</text>
  <text x="470" y="146" text-anchor="middle" class="mut" font-size="9">MY_ID=2</text>
  <circle cx="545" cy="135" r="7" class="pad"/><text x="560" y="139" class="mut" font-size="9">LED</text>
  <circle cx="430" cy="110" r="4" class="pad"/><path d="M430 110 V 98 h 18" class="ant"/>
  <rect x="430" y="200" width="150" height="50" rx="6" class="board"/>
  <text x="470" y="222" text-anchor="middle" class="lbl" font-weight="600" font-size="11">Node 3</text>
  <text x="470" y="236" text-anchor="middle" class="mut" font-size="9">MY_ID=3</text>
  <circle cx="545" cy="225" r="7" class="pad"/><text x="560" y="229" class="mut" font-size="9">LED</text>
  <circle cx="430" cy="200" r="4" class="pad"/><path d="M430 200 V 188 h 18" class="ant"/>
  <path d="M250 45 C 340 45, 340 45, 430 45" class="rf"/>
  <path d="M250 50 C 340 120, 340 120, 430 135" class="rf"/>
  <path d="M250 55 C 340 210, 340 210, 430 225" class="rf"/>
  <text x="330" y="150" text-anchor="middle" class="mut" font-size="10">ESP-NOW to all three;</text>
  <text x="330" y="165" text-anchor="middle" class="mut" font-size="10">each node checks the address</text>
  <text x="20" y="110" class="mut" font-size="10">LED: onboard, or D10 to 220 ohm to LED to GND for a bigger one.</text>
  <text x="20" y="126" class="mut" font-size="10">Each node on its own USB power.</text>
</svg>
